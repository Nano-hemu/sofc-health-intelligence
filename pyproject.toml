[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sofc-health-intelligence"
version = "0.1.0"
description = "Reproducible data and prognostics pipeline for redox-degraded solid oxide fuel cells."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Hemant Kumar Jaiswal" }]
dependencies = [
  "mat-io==1.0.0",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pooch>=1.8,<2",
  "pyarrow>=17,<23",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13.8,<15",
  "scipy>=1.14,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
analysis = [
  "impedance>=1.7,<2",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "plotly>=5.24,<7",
  "pyimpspec>=5.1,<6",
  "ruptures>=1.1,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]
ml = [
  "lightgbm>=4.5,<5",
  "mlflow>=3,<4",
  "optuna>=4,<5",
  "scikit-learn>=1.6,<2",
  "shap>=0.47,<1",
  "xgboost>=3,<4",
]
deep = [
  "captum>=0.8,<1",
  "lightning>=2.5,<3",
  "torch>=2.6,<3",
]
dev = [
  "mypy>=1.13,<2",
  "nbstripout>=0.8,<1",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
sofc-health = "sofc_health.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sofc_health"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "matio",
  "pooch",
  "matplotlib.*",
  "impedance.*",
  "pyimpspec.*",
  "seaborn",
  "sklearn.*",
  "statsmodels.*",
  "torch.*",
]
ignore_missing_imports = true
